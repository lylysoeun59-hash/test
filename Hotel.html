<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Hotel</title>
    <style>
        img {
            max-width: 100%;
            height: auto;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 10px;
                padding: 1rem;
            }

            nav {
                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;
            }

            .hero {
                margin: 1rem;
                padding: 1.5rem 1rem;
                width: auto;
            }

            .content-container {
                padding: 0 0.5rem;
                width: 100%;
            }
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-image: url('bg1.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #333;
            min-height: 100vh;
        }

        header {
            background-color: #0d4719;
            color: #fff;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            height: 50px;
            border-radius: 20px;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #f39c12;
        }

        .lang-select {
            padding: 5px 10px;
            border-radius: 4px;
            border: none;
            background-color: #fff;
            color: #333;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .hero {
    padding: 4rem 2rem;
    text-align: center;
    color: #fff;
    
    /* Glassmorphism Effect */
    background: rgba(255, 255, 255, 0.15); /* Low opacity white tint */
    backdrop-filter: blur(10px);          /* Blurs the body image behind it */
    -webkit-backdrop-filter: blur(10px);  /* Safari support */
    
    /* Optional enhancements for depth */
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
    
    /* Margin to separate from header */
    max-width: 800px;
    margin: 2rem auto 0 auto;
}

        .hero h1 {
            margin-bottom: 1rem;
        }

        .content-section {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background: #fff;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .card h2 {
            margin-bottom: 0.5rem;
            color: #1a252f;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Grand Hotel</div>
        <nav>
            <a href="index.html" id="nav-home">Home</a>
            <a href="about us.html" id="nav-about">About Us</a>
            <a href="book place.html" id="nav-book">Book Place</a>
            <a href="contact us.html" id="nav-contact">Contact Us</a>
            
            <select class="lang-select" id="langSelector" onchange="changeLanguage()">
                <option value="en">English</option>
                <option value="km">ភាសាខ្មែរ (Khmer)</option>
            </select>
        </nav>
    </header>

    <section class="hero">
        <h1 id="hero-title">Welcome to Grand Hotel</h1>
        <p id="hero-subtitle">Experience luxury and comfort in the heart of the city.</p>
    </section>

    <script>
        const translations = {
            en: {
                navHome: "Home",
                navAbout: "About Us",
                navBook: "Book Place",
                navContact: "Contact Us",
                heroTitle: "Welcome to Grand Hotel",
                heroSubtitle: "Experience luxury and comfort in the heart of the city.",
                homeTitle: "Home",
                homeDesc: "Discover our world-class amenities and premium rooms designed for your relaxation.",
                aboutTitle: "About Us",
                aboutDesc: "We are dedicated to offering exceptional hospitality services with over 20 years of excellence.",
                bookTitle: "Book Place",
                bookDesc: "Reserve your room or event space online easily with best price guarantees.",
                contactTitle: "Contact Us",
                contactDesc: "Reach out via email or phone for inquiries, reservations, and customer support."
            },
            km: {
                navHome: "ទំព័រដើម",
                navAbout: "អំពីយើង",
                navBook: "កក់កន្លែង",
                navContact: "ទំនាក់ទំនង",
                heroTitle: "សូមស្វាគមន៍មកកាន់ សណ្ឋាគារ ហ្គ្រេន",
                heroSubtitle: "បទពិសោធន៍នៃភាពស៊ីវិល័យ និងផាសុកភាពនៅកណ្តាលទីក្រុង។",
                homeTitle: "ទំព័រដើម",
                homeDesc: "ស្វែងយល់ពីសេវាកម្មកម្រិតពិភពលោក និងបន្ទប់សម្រាកដ៏ប្រណិតរបស់យើង។",
                aboutTitle: "អំពីយើង",
                aboutDesc: "យើងប្តេជ្ញាផ្តល់ជូននូវសេវាកម្មបដិសណ្ឋារកិច្ចដ៏ពិសេសជាមួយនឹងបទពិសោធន៍ជាង ២០ ឆ្នាំ។",
                bookTitle: "កក់កន្លែង",
                bookDesc: "កក់បន្ទប់ ឬទីតាំងព្រឹត្តិការណ៍របស់អ្នកតាមអនឡាញយ៉ាងងាយស្រួលជាមួយតម្លៃល្អបំផុត។",
                contactTitle: "ទំនាក់ទំនង",
                contactDesc: "ទាក់ទងមកយើងតាមរយៈអ៊ីមែល ឬទូរស័ព្ទសម្រាប់ការសាកសួរ និងការកក់។"
            }
        };

        function changeLanguage() {
            const selectedLang = document.getElementById("langSelector").value;
            const langData = translations[selectedLang];

            document.getElementById("nav-home").textContent = langData.navHome;
            document.getElementById("nav-about").textContent = langData.navAbout;
            document.getElementById("nav-book").textContent = langData.navBook;
            document.getElementById("nav-contact").textContent = langData.navContact;

            document.getElementById("hero-title").textContent = langData.heroTitle;
            document.getElementById("hero-subtitle").textContent = langData.heroSubtitle;

            document.getElementById("home-title").textContent = langData.homeTitle;
            document.getElementById("home-desc").textContent = langData.homeDesc;

            document.getElementById("about-title").textContent = langData.aboutTitle;
            document.getElementById("about-desc").textContent = langData.aboutDesc;

            document.getElementById("book-title").textContent = langData.bookTitle;
            document.getElementById("book-desc").textContent = langData.bookDesc;

            document.getElementById("contact-title").textContent = langData.contactTitle;
            document.getElementById("contact-desc").textContent = langData.contactDesc;
        }
    </script>

</body>
</html>
