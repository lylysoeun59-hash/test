<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment & Confirmation - Grand Hotel</title>
    <style>
        /* Modal background overlay */
.modal-overlay {
    display: none; /* Hidden by default */
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 1rem;
}

/* Modal container box (takes half/center of the screen) */
.modal-card {
    background: rgba(20, 45, 25, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 16px;
    width: 100%;
    max-width: 550px; /* Compact width */
    max-height: 90vh; /* Keeps it within screen height */
    overflow-y: auto; /* Scrollable if content overflows */
    padding: 1.5rem;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    position: relative;
    animation: fadeIn 0.3s ease-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Close button */
.close-btn {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 1.8rem;
    color: #fff;
    cursor: pointer;
    line-height: 1;
}

.close-btn:hover {
    color: #f39c12;
}

/* Compact QR Code Box */
.qr-box-small {
    width: 160px;
    height: 160px;
    background: #fff;
    border-radius: 12px;
    padding: 8px;
    margin: 10px auto;
    border: 2px solid #f39c12;
}

.qr-box-small img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}
    </style>
</head>
<body>

   <div class="modal-overlay" id="paymentModal">
    <div class="modal-card">
        <span class="close-btn" onclick="closeModal()">&times;</span>

        <h2 id="modal-title" style="color: #f39c12; font-size: 1.3rem; margin-bottom: 0.5rem; text-align: center;">
            Thank You For Choosing Grand Hotel!
        </h2>
        <p id="modal-subtitle" style="font-size: 0.85rem; color: #ddd; text-align: center; margin-bottom: 1rem;">
            Please scan the QR code to complete your payment and let us know your special requests.
        </p>

        <div style="text-align: center;">
            <div class="qr-box-small">
                <img src="qr.jpg" alt="Payment QR Code">
            </div>
            <p id="qr-desc" style="font-size: 0.8rem; color: #ccc; margin-bottom: 1rem;">
                Scan using ABA Mobile, Bakong, or any Banking App in Cambodia.
            </p>
        </div>

        <form class="request-form" onsubmit="handleModalSubmit(event)">
            <div class="form-group">
                <label id="lbl-name">Your Full Name</label>
                <input type="text" required placeholder="John Doe">
            </div>

            <div class="form-group">
                <label id="lbl-phone">Phone / Telegram Number</label>
                <input type="tel" required placeholder="+855 12 345 678">
            </div>

            <div class="form-group">
                <label id="lbl-requests">Special Preparation Requests</label>
                <textarea rows="3" placeholder="e.g., Late check-in, extra pillows, airport pickup..."></textarea>
            </div>

            <button type="submit" class="confirm-btn" id="btn-submit" style="width: 100%; margin-top: 10px;">
                Confirm Payment & Requests
            </button>
        </form>
    </div>
</div>
<script>
        // Existing language code...
        const translations = { ... };
        function changeLanguage() { ... }

        // --- ADD THE MODAL FUNCTIONS HERE ---
        function openModal() {
            document.getElementById("paymentModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("paymentModal").style.display = "none";
        }

        window.onclick = function(event) {
            const modal = document.getElementById("paymentModal");
            if (event.target === modal) {
                modal.style.display = "none";
            }
        }

        function handleModalSubmit(event) {
            event.preventDefault();
            alert("Thank you! Your payment details and special requests have been received.");
            closeModal();
        }
    </script>
</body>
</html>
</body>
</html>
